name: Build installers

# AniFaceUp is a Windows desktop app (WebView2), so installers are built on Windows.
# Trigger manually (Actions > Run workflow) or by pushing a version tag (e.g. v0.1.0).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # public/mediapipe/ is git-ignored, so it must be materialized before building.
      - name: Vendor MediaPipe assets
        run: npm run vendor:mediapipe

      - name: Verify vendored assets
        shell: pwsh
        run: |
          $required = @(
            'public/mediapipe/face_landmarker.task',
            'public/mediapipe/selfie_segmenter.tflite',
            'public/mediapipe/wasm/vision_wasm_internal.wasm',
            'public/mediapipe/wasm/vision_wasm_internal.js'
          )
          foreach ($f in $required) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing vendored asset: $f" }
          }
          Write-Host 'All vendored assets are present.'

      - name: Build Tauri app and installers
        run: npm run tauri build

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anifaceup-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
