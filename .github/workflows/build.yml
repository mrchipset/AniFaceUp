name: Build installers and portable

# AniFaceUp is a Windows desktop app (WebView2), so builds run on Windows.
# Produces MSI/NSIS installers plus a portable (green) zip containing the
# self-contained release exe.
# Trigger manually (Actions > Run workflow) or by pushing a version tag (e.g. v0.1.0).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # public/mediapipe/ is git-ignored, so it must be materialized before building.
      - name: Vendor MediaPipe assets
        run: npm run vendor:mediapipe

      - name: Verify vendored assets
        shell: pwsh
        run: |
          $required = @(
            'public/mediapipe/face_landmarker.task',
            'public/mediapipe/selfie_segmenter.tflite',
            'public/mediapipe/wasm/vision_wasm_internal.wasm',
            'public/mediapipe/wasm/vision_wasm_internal.js'
          )
          foreach ($f in $required) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing vendored asset: $f" }
          }
          Write-Host 'All vendored assets are present.'

      - name: Build Tauri app and installers
        run: npm run tauri build

      # Portable / green build: the release exe is self-contained (the frontend
      # and bundled assets are embedded), so a zip of it needs no installer.
      - name: Assemble portable build
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/anifaceup.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Release executable not found: $exe" }
          $dir = 'portable/AniFaceUp'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $dir 'AniFaceUp.exe') -Force
          $readme = @(
            'AniFaceUp - portable build',
            '==========================',
            '',
            'Run AniFaceUp.exe directly. No installation is required.',
            '',
            'Requirements',
            '- Windows 10/11 with the Microsoft Edge WebView2 Runtime',
            '  (preinstalled on most systems).',
            '',
            'Notes',
            '- Settings and the WebView2 profile are stored per user under',
            '  %LOCALAPPDATA%\com.anifaceup.app. Delete that folder to reset.',
            '- Closing the main window exits the app.',
            '- The ML/3D assets are embedded in the exe.'
          ) -join "`n"
          Set-Content -LiteralPath (Join-Path $dir 'README.txt') -Value $readme -Encoding UTF8
          $ref = '${{ github.ref_name }}' -replace '[^A-Za-z0-9._-]', '-'
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = 'local' }
          $zip = "AniFaceUp-$ref-portable-win64.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -Force
          Write-Host "Portable build: $zip"

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anifaceup-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload portable build as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anifaceup-portable
          if-no-files-found: error
          path: |
            portable/AniFaceUp/AniFaceUp.exe
            portable/AniFaceUp/README.txt
            *.zip

      - name: Publish GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            portable/AniFaceUp/AniFaceUp.exe
            *.zip
