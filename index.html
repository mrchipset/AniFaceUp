<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniFaceUp</title>
    <style>
      /*
       * Critical boot styles. Kept inline so the first paint is already on-brand
       * before Vite/module CSS arrives. Uses the same warm tokens as styles.css.
       */
      :root {
        color-scheme: light;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #f3f1ea; /* --bg */
      }

      /* The shell waits behind the splash until boot signals readiness. */
      .app {
        visibility: hidden;
      }

      body.ready .app {
        visibility: visible;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #f3f1ea; /* --bg */
        color: #1e1b15; /* --ink */
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 160ms ease;
      }

      #boot * {
        box-sizing: border-box;
      }

      #boot .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      #boot .boot-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid #d9d4c6; /* --line-2 */
        border-radius: 8px;
        background: #f8f6f0; /* --surface-2 */
        color: #1e1b15;
      }

      #boot .boot-name {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.012em;
        line-height: 1.5;
        color: #1e1b15;
      }

      #boot .boot-track {
        position: relative;
        width: 128px;
        height: 2px;
        border-radius: 999px;
        background: #e6e2d8; /* --line */
        overflow: hidden;
      }

      #boot .boot-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 38%;
        border-radius: inherit;
        background: #8a6a2e; /* --focus */
        animation: boot-sweep 1.4s cubic-bezier(0.5, 0, 0.35, 1) infinite;
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      body.ready #boot {
        opacity: 0;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot {
          transition: none;
        }

        #boot .boot-bar {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite" aria-label="Starting AniFaceUp">
      <div class="boot-inner">
        <span class="boot-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none">
            <rect x="1.5" y="1.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="1.3" />
            <circle cx="10" cy="10" r="3.4" stroke="currentColor" stroke-width="1.3" />
            <circle cx="10" cy="10" r="1.05" fill="currentColor" />
          </svg>
        </span>
        <span class="boot-name">AniFaceUp</span>
        <div class="boot-track" aria-hidden="true"><span class="boot-bar"></span></div>
      </div>
    </div>

    <div class="app">
      <header class="appbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="20" height="20" fill="none">
              <rect x="1.5" y="1.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="1.3" />
              <circle cx="10" cy="10" r="3.4" stroke="currentColor" stroke-width="1.3" />
              <circle cx="10" cy="10" r="1.05" fill="currentColor" />
            </svg>
          </span>
          <span class="brand-name">AniFaceUp</span>
        </div>

        <div class="appbar-meta">
          <span id="diag" class="diag" hidden></span>
        </div>

        <div class="appbar-status" id="appbar-status" aria-live="polite"></div>

        <div class="appbar-actions">
          <button id="btn-import-model" class="btn btn-quiet" type="button">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 2.6v7.2" />
              <path d="M4.9 6.9 8 10l3.1-3.1" />
              <path d="M2.8 13.2h10.4" />
            </svg>
            <span>Import model</span>
          </button>
          <button id="btn-screenshot" class="btn btn-quiet" type="button">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="1.9" y="4.2" width="12.2" height="8.4" rx="2.2" />
              <circle cx="8" cy="8.4" r="2.3" />
              <path d="M5.7 4.2 6.6 2.7h2.8l.9 1.5" />
            </svg>
            <span>Screenshot</span>
          </button>
          <button id="btn-record" class="btn btn-primary btn-record" type="button" aria-pressed="false">
            <span class="rec-dot" aria-hidden="true"></span>
            <span>Record</span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="stage" aria-label="Preview">
          <figure class="monitor monitor-primary">
            <figcaption class="monitor-bar">
              <span class="eyebrow">Composite</span>
              <span class="monitor-hint">drag to move &middot; drag a corner or edge handle to resize &middot; keep-aspect lock in the rail</span>
            </figcaption>
            <div class="frame frame-primary">
              <canvas id="composite" width="640" height="480"></canvas>
            </div>
          </figure>

          <div class="monitor-row">
            <figure class="monitor">
              <figcaption class="monitor-bar"><span class="eyebrow">Raw &middot; tracking</span></figcaption>
              <div id="preview" class="frame frame-flip">
                <video id="webcam" autoplay playsinline muted hidden></video>
                <canvas id="overlay"></canvas>
              </div>
            </figure>

            <figure class="monitor">
              <figcaption class="monitor-bar"><span class="eyebrow">Avatar &middot; source</span></figcaption>
              <div class="frame">
                <canvas id="avatar-source" width="240" height="240"></canvas>
              </div>
            </figure>

            <figure class="monitor">
              <figcaption class="monitor-bar"><span class="eyebrow">Output &middot; crop</span></figcaption>
              <div class="frame">
                <canvas id="output" width="320" height="320"></canvas>
              </div>
            </figure>
          </div>
        </section>

        <aside class="rail" aria-label="Controls">
          <div id="controls" class="controls"></div>
        </aside>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      // Safety net: if the module boot never completes, reveal the app anyway.
      setTimeout(function () {
        document.body.classList.add('ready')
      }, 5000)
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
