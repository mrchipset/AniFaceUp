<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniFaceUp</title>
  </head>
  <body>
    <div class="app">
      <header class="appbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="20" height="20" fill="none">
              <rect x="1.5" y="1.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="1.3" />
              <circle cx="10" cy="10" r="3.4" stroke="currentColor" stroke-width="1.3" />
              <circle cx="10" cy="10" r="1.05" fill="currentColor" />
            </svg>
          </span>
          <span class="brand-name">AniFaceUp</span>
        </div>

        <div class="appbar-meta">
          <span id="diag" class="diag">diagnostics</span>
        </div>

        <div class="appbar-status" id="appbar-status" aria-live="polite"></div>

        <div class="appbar-actions">
          <button id="btn-import-model" class="btn btn-quiet" type="button">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 2.6v7.2" />
              <path d="M4.9 6.9 8 10l3.1-3.1" />
              <path d="M2.8 13.2h10.4" />
            </svg>
            <span>Import model</span>
          </button>
          <button id="btn-screenshot" class="btn btn-quiet" type="button">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="1.9" y="4.2" width="12.2" height="8.4" rx="2.2" />
              <circle cx="8" cy="8.4" r="2.3" />
              <path d="M5.7 4.2 6.6 2.7h2.8l.9 1.5" />
            </svg>
            <span>Screenshot</span>
          </button>
          <button id="btn-record" class="btn btn-primary btn-record" type="button" aria-pressed="false">
            <span class="rec-dot" aria-hidden="true"></span>
            <span>Record</span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="stage" aria-label="Preview">
          <figure class="monitor monitor-primary">
            <figcaption class="monitor-bar">
              <span class="eyebrow">Composite</span>
              <span class="monitor-hint">drag on the preview to position the output selection</span>
            </figcaption>
            <div class="frame frame-primary">
              <canvas id="composite" width="640" height="480"></canvas>
            </div>
          </figure>

          <div class="monitor-row">
            <figure class="monitor">
              <figcaption class="monitor-bar"><span class="eyebrow">Raw &middot; tracking</span></figcaption>
              <div id="preview" class="frame frame-flip">
                <video id="webcam" autoplay playsinline muted hidden></video>
                <canvas id="overlay"></canvas>
              </div>
            </figure>

            <figure class="monitor">
              <figcaption class="monitor-bar"><span class="eyebrow">Avatar &middot; source</span></figcaption>
              <div class="frame">
                <canvas id="avatar-source" width="240" height="240"></canvas>
              </div>
            </figure>

            <figure class="monitor">
              <figcaption class="monitor-bar"><span class="eyebrow">Output &middot; crop</span></figcaption>
              <div class="frame">
                <canvas id="output" width="320" height="320"></canvas>
              </div>
            </figure>
          </div>
        </section>

        <aside class="rail" aria-label="Controls">
          <div id="controls" class="controls"></div>
        </aside>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
