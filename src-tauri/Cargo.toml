[package]
name = "anifaceup"
version = "0.1.0"
description = "AniFaceUp - realtime camera cartoonization"
authors = ["AniFaceUp"]
edition = "2021"
rust-version = "1.77.2"
default-run = "anifaceup"

[lib]
name = "anifaceup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
